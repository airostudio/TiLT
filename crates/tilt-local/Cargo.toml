[package]
name = "tilt-local"
description = "Run TiLT in a normal web browser on this computer: local-only server (127.0.0.1) with a per-run access token"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tilt-local"
path = "src/main.rs"

[dependencies]
amiga-service = { path = "../amiga-service" }
amiga-core = { path = "../amiga-core" }
serde_json = "1"
tiny_http = "0.12"
ctrlc = { version = "3", features = ["termination"] }
