[package]
name = "amiga-service"
description = "Command layer shared by the Tauri shell and the dev bridge: one allow-listed dispatch(cmd, args) over amiga-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
amiga-core = { path = "../amiga-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
amiga-core = { path = "../amiga-core", features = ["test-support"] }
